components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ActivityItem:
      type: object
      required: [id, kind, title, detail, time, accent]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [live, announcement, project, event, class, resource]
        title: { type: string }
        detail: { type: string }
        time: { type: string }
        accent: { type: string }
        actor: { type: ["string", "null"] }
    Space:
      type: object
      required: [id, name, type, description, members, status, accent, joined]
      properties:
        id: { type: string }
        name: { type: string }
        type:
          type: string
          enum: [school, class, subject, club, project, event]
        description: { type: string }
        members: { type: number }
        status: { type: string }
        accent: { type: string }
        joined: { type: boolean }
    SpaceDetail:
      allOf:
        - $ref: "#/components/schemas/Space"
        - type: object
          required: [channels, spotlight]
          properties:
            channels:
              type: array
              items: { type: string }
            spotlight: { type: string }
    SpaceMembership:
      type: object
      required: [spaceId, joined, memberCount]
      properties:
        spaceId: { type: string }
        joined: { type: boolean }
        memberCount: { type: number }
    Credential:
      type: object
      required: [id, name, className, role, year, verified, expires, serial]
      properties:
        id: { type: string }
        name: { type: string }
        className: { type: string }
        role: { type: string }
        year: { type: string }
        verified: { type: boolean }
        expires: { type: string }
        serial: { type: string }
    VerificationStatus:
      type: object
      required: [userId, displayName, profileCompleted, membershipStatus, roleStatus, requestedRole, schoolYear, expiresOn, credentialSerial, isAdministrator]
      properties:
        userId: { type: string }
        displayName: { type: string }
        profileCompleted: { type: boolean }
        membershipStatus:
          type: string
          enum: [pending, approved, suspended, expired]
        roleStatus:
          type: string
          enum: [pending, approved, suspended, expired]
        requestedRole:
          type: string
          enum: [student, teacher, admin]
        schoolYear: { type: string }
        expiresOn: { type: string }
        credentialSerial: { type: ["string", "null"] }
        isAdministrator: { type: boolean }
        lastReviewedAt: { type: ["string", "null"] }
        lastReviewNote: { type: ["string", "null"] }
    IdentityProfileInput:
      type: object
      required: [displayName, className, requestedRole]
      properties:
        displayName:
          type: string
          minLength: 2
        className:
          type: string
          minLength: 2
        requestedRole:
          type: string
          enum: [student, teacher]
    VerificationAuditEntry:
      type: object
      required: [action, actorUserId, createdAt]
      properties:
        action:
          type: string
          enum: [submitted, approved, suspended, renewed]
        actorUserId: { type: string }
        createdAt: { type: string }
        note: { type: ["string", "null"] }
    VerificationRequest:
      allOf:
        - $ref: "#/components/schemas/VerificationStatus"
        - type: object
          required: [audit]
          properties:
            audit:
              type: array
              items:
                $ref: "#/components/schemas/VerificationAuditEntry"
    VerificationActionInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, suspend, renew]
        role:
          type: string
          enum: [student, teacher, admin]
        note: { type: string, maxLength: 500 }
    CampusHome:
      type: object
      required: [greeting, roleLabel, schoolPulse, nextActions, schedule, spotlight]
      properties:
        greeting: { type: string }
        roleLabel: { type: string }
        schoolPulse: { type: number }
        nextActions:
          type: array
          items: { type: string }
        schedule:
          type: array
          items:
            type: object
            required: [time, subject, room, teacher]
            properties:
              time: { type: string }
              subject: { type: string }
              room: { type: string }
              teacher: { type: string }
        spotlight:
          type: object
          required: [title, detail, cta]
          properties:
            title: { type: string }
            detail: { type: string }
            cta: { type: string }
    PostInput:
      type: object
      required: [spaceId, kind, body]
      properties:
        spaceId: { type: string }
        kind:
          type: string
          enum: [discussion, update, resource, project, event]
        body: { type: string, minLength: 1 }
    Post:
      allOf:
        - $ref: "#/components/schemas/PostInput"
        - type: object
          required: [id, author, time]
          properties:
            id: { type: string }
            author: { type: string }
            time: { type: string }

    AssignmentInput:
      type: object
      required: [spaceId, title, description, maxScore]
      properties:
        spaceId: { type: string }
        title: { type: string }
        description: { type: string }
        dueDate: { type: ["string", "null"] }
        maxScore: { type: number }
    Assignment:
      allOf:
        - $ref: "#/components/schemas/AssignmentInput"
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string }
            createdAt: { type: string }
    SubmissionInput:
      type: object
      required: [content]
      properties:
        content: { type: string }
    Submission:
      allOf:
        - $ref: "#/components/schemas/SubmissionInput"
        - type: object
          required: [id, assignmentId, studentId, submittedAt]
          properties:
            id: { type: string }
            assignmentId: { type: string }
            studentId: { type: string }
            score: { type: ["number", "null"] }
            feedback: { type: ["string", "null"] }
            submittedAt: { type: string }
    ChannelMessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string }
    ChannelMessage:
      allOf:
        - $ref: "#/components/schemas/ChannelMessageInput"
        - type: object
          required: [id, channelId, spaceId, userId, createdAt]
          properties:
            id: { type: string }
            channelId: { type: string }
            spaceId: { type: string }
            userId: { type: string }
            createdAt: { type: string }
