openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: campus
    description: Living campus overview and activity
  - name: spaces
    description: School, class, club, and project spaces
  - name: identity
    description: School identity and credentials
  - name: verification
    description: School membership and role verification
  - name: social
    description: Contextual school posts
security:
  - BearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
      security: []
  /campus/home:
    get:
      operationId: getCampusHome
      tags: [campus]
      summary: Get the role-aware campus home
      responses:
        "200":
          description: Campus home snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusHome"
  /campus/activity:
    get:
      operationId: getCampusActivity
      tags: [campus]
      summary: Get the latest school activity
      responses:
        "200":
          description: Recent activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /spaces:
    get:
      operationId: getSpaces
      tags: [spaces]
      summary: List spaces visible to the current member
      responses:
        "200":
          description: Visible spaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Space"
  /spaces/{spaceId}:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSpace
      tags: [spaces]
      summary: Get a space and its current context
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Space detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceDetail"
        "404":
          description: Space not found
  /spaces/{spaceId}/join:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: joinSpace
      tags: [spaces]
      summary: Join an eligible school space
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated space membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpaceMembership"
  /identity/credential:
    get:
      operationId: getIdentityCredential
      tags: [identity]
      summary: Get the current member's school credential
      responses:
        "200":
          description: Digital school credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
  /identity/verification:
    get:
      operationId: getVerificationStatus
      tags: [verification]
      summary: Get the signed-in member's verification status
      responses:
        "200":
          description: Membership and role verification state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationStatus"
        "401":
          description: Authentication required
  /identity/profile:
    patch:
      operationId: updateIdentityProfile
      tags: [identity]
      summary: Complete the signed-in member's school profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityProfileInput"
      responses:
        "200":
          description: Updated verification state after profile completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationStatus"
        "400":
          description: Invalid profile information
        "401":
          description: Authentication required
  /identity/verification/requests:
    get:
      operationId: getVerificationRequests
      tags: [verification]
      summary: List school verification requests for administrators
      responses:
        "200":
          description: Verification requests and audit history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VerificationRequest"
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
  /identity/verification/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: updateVerification
      tags: [verification]
      summary: Approve, suspend, or renew a member's school verification
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationActionInput"
      responses:
        "200":
          description: Updated verification request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationRequest"
        "400":
          description: Invalid verification action
        "401":
          description: Authentication required
        "403":
          description: Administrator access required
        "404":
          description: Verification request not found
  /social/posts:
    get:
      operationId: getSpacePosts
      tags: [social]
      summary: List posts in a school space
      parameters:
        - name: spaceId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Posts in the space
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"
    post:
      operationId: createPost
      tags: [social]
      summary: Create a post in a school context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
  /assignments:
    get:
      operationId: getAssignments
      tags: [academic]
      summary: List assignments for the current user spaces
      responses:
        "200":
          description: List of assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assignment"
    post:
      operationId: createAssignment
      tags: [academic]
      summary: Create an assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentInput"
      responses:
        "201":
          description: Created assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
  /assignments/{assignmentId}/submit:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: submitAssignment
      tags: [academic]
      summary: Submit work for an assignment
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmissionInput"
      responses:
        "201":
          description: Created submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
  /spaces/{spaceId}/channels/{channelId}/messages:
    parameters:
      - name: spaceId
        in: path
        required: true
        schema:
          type: string
      - name: channelId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getChannelMessages
      tags: [social]
      summary: Get messages for a specific channel
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
        - name: channelId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Channel messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelMessage"
    post:
      operationId: createChannelMessage
      tags: [social]
      summary: Send a message to a channel
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
        - name: channelId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelMessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelMessage"

