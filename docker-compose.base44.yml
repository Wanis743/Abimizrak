services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus"]
      interval: 3s
      timeout: 3s
      retries: 20

  setup:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install -g pnpm@10 && pnpm install --frozen-lockfile"
    depends_on:
      db:
        condition: service_healthy

  migrate:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://campus:campus@db:5432/campus
    command: sh -c "npm install -g pnpm@10 && pnpm --filter @workspace/db push-force"
    depends_on:
      setup:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  seed:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: campus
    command: >-
      psql postgresql://campus:campus@db:5432/campus -c
      "INSERT INTO schools (id, name_ar, name_fr, name_en, code) VALUES ('abi-mizrak', 'ثانوية أبي مزراق المقراني', 'Lycée Abi Mizrak El Mokrani', 'Lycée Abi Mizrak', 'ABI-MIZRAK') ON CONFLICT (id) DO NOTHING"
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      PORT: "5000"
      DATABASE_URL: postgresql://campus:campus@db:5432/campus
      CORS_ORIGIN: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    command: sh -c "npm install -g pnpm@10 && pnpm --filter @workspace/api-server dev"
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "8000:5000"

  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      PORT: "5173"
      VITE_HOST: "0.0.0.0"
      API_PROXY_TARGET: "http://api:5000"
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:-}
    command: sh -c "npm install -g pnpm@10 && pnpm --filter @workspace/abi-mizrak-campus dev"
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:5173"

volumes:
  pgdata:
  node_modules:
